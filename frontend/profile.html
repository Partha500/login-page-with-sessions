<!DOCTYPE html>
<html>
<head><title>Profile</title></head>
<body>
  <h1>My Profile</h1>
  <p id="username">Loading...</p>
  <p id="email"></p>
  <p id="created"></p>
  <button id="logoutBtn">Logout</button>
  <p id="message"></p>

  <script>
    function messageFor(status) {
      if (status === 400) return 'Bad request. Check your input.';
      if (status === 401) return 'Please log in.';
      if (status === 403) return 'You are not allowed to do that.';
      if (status === 404) return 'Not found.';
      if (status === 409) return 'That already exists.';
      if (status >= 500) return 'Server problem. Try again later.';
      return 'Unexpected error.';
    }

    async function loadProfile() {
      try {
        const response = await fetch('http://localhost:3000/profile', {
          credentials: 'include'
        });

        if (response.status === 401) {
          window.location.href = 'login.html';
          return;
        }
        if (!response.ok) {
          document.getElementById('username').textContent = messageFor(response.status);
          return;
        }

        const data = await response.json();
        document.getElementById('username').textContent = 'Username: ' + data.user.username;
        document.getElementById('email').textContent = 'Email: ' + data.user.email;
        document.getElementById('created').textContent = 'Joined: ' + data.user.created_at;
      } catch (err) {
        document.getElementById('username').textContent = 'Cannot reach the server.';
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        const response = await fetch('http://localhost:3000/logout', {
          method: 'POST',
          credentials: 'include'
        });
        if (response.ok) {
          window.location.href = 'login.html';
        } else {
          document.getElementById('message').textContent = messageFor(response.status);
        }
      } catch (err) {
        document.getElementById('message').textContent = 'Cannot reach the server.';
      }
    });

    loadProfile();
  </script>
</body>
</html>
